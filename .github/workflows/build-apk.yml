
export let songs = [];

export function setSongs(newSongs) {
  songs = Array.isArray(newSongs) ? newSongs : [];

  window.dispatchEvent(
    new CustomEvent("songsupdated", {
      detail: songs
    })
  );
}

export function getSongs() {
  return songs;
}

class MusicPlayer {
  constructor() {
    this.audio = new Audio();
    this.currentIndex = -1;
    this.isPlaying = false;

    this.audio.addEventListener("play", () => {
      this.isPlaying = true;
    });

    this.audio.addEventListener("pause", () => {
      this.isPlaying = false;
    });

    this.audio.addEventListener("ended", () => {
      this.next();
    });
  }

  play(url, title = "Music") {
    if (!url) return;

    if (this.audio.src !== new URL(url, window.location.href).href) {
      this.audio.src = url;
    }

    this.audio.play().catch(error => {
      console.error("Playback error:", error);
    });

    window.dispatchEvent(
      new CustomEvent("songchange", {
        detail: { url, title }
      })
    );
  }

  playSong(index) {
    if (index < 0 || index >= songs.length) return;

    this.currentIndex = index;

    const song = songs[index];
    const url = song.url || song.audioUrl || song.src;

    if (!url) {
      console.error("Song URL is missing:", song);
      return;
    }

    this.play(url, song.title || song.name || "Music");
  }

  pause() {
    this.audio.pause();
  }

  resume() {
    return this.audio.play().catch(console.error);
  }

  toggle() {
    if (this.audio.paused) {
      return this.resume();
    }
    this.pause();
  }

  next() {
    if (this.currentIndex < songs.length - 1) {
      this.playSong(this.currentIndex + 1);
    }
  }

  previous() {
    if (this.currentIndex > 0) {
      this.playSong(this.currentIndex - 1);
    }
  }

  setVolume(volume) {
    this.audio.volume = Math.max(0, Math.min(1, volume));
  }

  seek(seconds) {
    this.audio.currentTime = seconds;
  }
}

const player = new MusicPlayer();

export default player;

export const playMusic = (url, title) =>
  player.play(url, title);

export const pauseMusic = () =>
  player.pause();

export const resumeMusic = () =>
  player.resume();

export const toggleMusic = () =>
  player.toggle();

export const nextSong = () =>
  player.next();

export const previousSong = () =>
  player.previous();

window.musicPlayer = player;
window.playMusic = playMusic;
window.pauseMusic = pauseMusic;
window.toggleMusic = toggleMusic;
